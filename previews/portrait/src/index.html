<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>LingoTrace · 竖屏布局预览</title><link rel="stylesheet" href="./style.css"></head><body>
<header class="preview-bar"><span>LINGOTRACE <i>布局预览</i></span><nav aria-label="预览模式"><button data-mode="auto" aria-pressed="true">自适应</button><button data-mode="portrait" aria-pressed="false">竖屏</button><button data-mode="landscape" aria-pressed="false">横屏</button><button id="keyboard" aria-pressed="false" title="模拟键盘占位">键盘</button></nav></header>
<main id="stage" class="stage" data-mode="auto"><section class="experience" aria-label="咖啡对话布局预览">
<div class="top-hud"><div class="identity"><span class="eyebrow"><b></b> SCENE 06 / PREVIEW</span><h1>CAFE<br class="mobile-break"> CONVERSATION</h1><p>先听一句，再写下来</p></div><div class="goal"><span class="hud-title">目标 · 3 / 24</span><canvas id="goal" aria-label="预览目标示例：3 / 24，非实际训练记录"></canvas><span class="hud-caption">目标示例</span></div><div class="trend"><span class="hud-title">输入趋势</span><canvas id="trend" aria-label="预览输入趋势示例，非实际记录"></canvas><span class="hud-caption">示例 · 0–6 字符/秒</span></div></div>
<div class="video-wrap"><video id="video" playsinline preload="metadata" poster="./assets/06-cafe-poster.jpg" src="./assets/06-cafe.mp4" aria-label="咖啡馆横屏视频"></video><div class="frame-corner corner-a"></div><div class="frame-corner corner-b"></div><span class="video-label">06 · CAFÉ</span><button id="video-play" class="video-play" aria-label="播放视频">▶</button></div>
<div class="bottom-hud"><div class="prompt"><span class="eyebrow">LISTEN & TYPE</span><p id="cue">听完后，试着写下你听到的英文。</p><button id="hint" class="quiet" aria-expanded="false">显示提示</button></div><form id="form" autocomplete="off"><label for="answer">你的输入 <span>仅本页预览，不计入训练</span></label><div class="input-row"><input id="answer" placeholder="写下你听到的英文…" enterkeyhint="done" spellcheck="false"><button class="confirm" type="submit">确认 <span>↵</span></button></div><p id="feedback" aria-live="polite">输入和确认仅用于检查布局。</p></form><div class="timeline"><div class="timeline-meta"><span id="elapsed">00:00</span><span>VIDEO TIMELINE</span><span id="duration">--:--</span></div><input id="seek" type="range" disabled min="0" max="1" value="0" step="0.01" aria-label="视频时间轴"></div><div class="transport"><button id="repeat" aria-label="重新播放">↶ <span>重听</span></button><button id="play" class="primary-play" aria-label="播放">▶</button><button id="mute" aria-label="静音" aria-pressed="false">♪ <span>声音</span></button></div><footer><span class="dot"></span> HUD 示例 · 不保存记录 <span class="ratio">原片 16:9 · 完整显示</span></footer></div>
</section><aside class="keyboard-demo" aria-label="模拟键盘占位"><span>模拟键盘占位 · 不是系统键盘</span><div>Q W E R T Y U I O P</div><div>A S D F G H J K L</div><div>Z X C V B N M</div><button id="close-keyboard">收起</button></aside></main><script type="module" src="./app.js"></script></body></html>
